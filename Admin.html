<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Peladeiros FTV</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            background: #000;
            border-bottom: 3px solid #f5c518;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -20px -20px 30px -20px;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #f5c518;
            text-transform: uppercase;
        }

        header a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f5c518;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #f5c518;
        }

        .jogo-row {
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            gap: 8px;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            position: relative;
        }

        .jogo-row input {
            border: none;
            background: transparent;
            padding: 6px 8px;
            text-align: center;
            font-size: 0.85rem;
        }

        .jogo-row input:focus {
            background: #1a1a1a;
            border-radius: 6px;
        }

        .placar-input {
            text-align: center !important;
            font-weight: 700;
            color: #f5c518 !important;
            font-size: 1rem !important;
        }

        .btn-remove {
            position: absolute;
            right: -10px;
            top: -10px;
            background: #e74c3c;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            color: #fff;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .btn-add-jogo {
            width: 100%;
            background: transparent;
            border: 1px dashed #444;
            border-radius: 8px;
            padding: 10px;
            color: #666;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .btn-add-jogo:hover {
            border-color: #f5c518;
            color: #f5c518;
        }

        .cols-label {
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            gap: 8px;
            margin-bottom: 6px;
            padding: 0 12px;
        }

        .cols-label span {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #555;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-salvar {
            width: 100%;
            background: #f5c518;
            border: none;
            border-radius: 10px;
            padding: 16px;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-salvar:hover {
            background: #e0b000;
            transform: translateY(-1px);
        }

        .btn-salvar:disabled {
            background: #444;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2ecc71;
            color: #000;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 12px 24px;
            border-radius: 8px;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .toast.erro {
            background: #e74c3c;
            color: #fff;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .rodadas-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rodada-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
        }

        .rodada-item span {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .rodada-item small {
            color: #666;
            font-size: 0.75rem;
        }

        .btn-del {
            background: transparent;
            border: 1px solid #e74c3c;
            border-radius: 6px;
            color: #e74c3c;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-del:hover { background: #e74c3c; color: #fff; }

        .loading-text {
            color: #555;
            font-size: 0.85rem;
            text-align: center;
            padding: 16px;
        }

        .contador {
            font-size: 0.75rem;
            color: #666;
            text-align: right;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>⚽ Admin — Peladeiros FTV</h1>
    <a href="jogos.html">← Ver site</a>
</header>

<div class="container">

    <!-- CADASTRAR NOVA RODADA -->
    <div class="card">
        <h2>📅 Nova Rodada</h2>

        <div class="field">
            <label>Data da Rodada</label>
            <input type="text" id="data-rodada" placeholder="DD/MM/AAAA" maxlength="10">
        </div>

        <div class="cols-label">
            <span>Time 1</span>
            <span>Placar</span>
            <span>Time 2</span>
        </div>

        <div id="lista-jogos"></div>

        <button class="btn-add-jogo" onclick="adicionarJogo()">+ Adicionar Jogo</button>

        <div class="contador" id="contador">0 jogos</div>

        <button class="btn-salvar" id="btn-salvar" onclick="salvarRodada()">💾 Salvar Rodada</button>
    </div>

    <!-- RODADAS SALVAS -->
    <div class="card">
        <h2>📋 Rodadas Salvas</h2>
        <div id="rodadas-lista" class="rodadas-lista">
            <p class="loading-text">Carregando...</p>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyiMxWmU6ez1i_wdXNJ3egDziaR-A",
        authDomain: "peladeiros-ftv.firebaseapp.com",
        projectId: "peladeiros-ftv",
        storageBucket: "peladeiros-ftv.firebasestorage.app",
        messagingSenderId: "145877201809",
        appId: "1:145877201809:web:ba9aca8aca228cf3637878"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- UI ----
    let jogosCount = 0;

    window.adicionarJogo = function() {
        jogosCount++;
        const id = 'jogo-' + jogosCount;
        const div = document.createElement('div');
        div.className = 'jogo-row';
        div.id = id;
        div.innerHTML = `
            <input type="text" placeholder="Time 1" class="t1">
            <input type="text" placeholder="0 x 0" class="placar placar-input">
            <input type="text" placeholder="Time 2" class="t2">
            <button class="btn-remove" onclick="removerJogo('${id}')">✕</button>
        `;
        document.getElementById('lista-jogos').appendChild(div);
        atualizarContador();
        div.querySelector('.t1').focus();
    }

    window.removerJogo = function(id) {
        document.getElementById(id)?.remove();
        atualizarContador();
    }

    function atualizarContador() {
        const n = document.querySelectorAll('.jogo-row').length;
        document.getElementById('contador').textContent = n + (n === 1 ? ' jogo' : ' jogos');
    }

    // Formatar data automaticamente
    document.getElementById('data-rodada').addEventListener('input', function(e) {
        let v = e.target.value.replace(/\D/g, '');
        if (v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
        if (v.length >= 6) v = v.slice(0,5) + '/' + v.slice(5,9);
        e.target.value = v;
    });

    // ---- SALVAR ----
    window.salvarRodada = async function() {
        const data = document.getElementById('data-rodada').value.trim();
        if (!data || data.length < 10) { showToast('Informe a data no formato DD/MM/AAAA', true); return; }

        const rows = document.querySelectorAll('.jogo-row');
        if (rows.length === 0) { showToast('Adicione pelo menos um jogo', true); return; }

        const jogos = [];
        let ok = true;
        rows.forEach(row => {
            const t1 = row.querySelector('.t1').value.trim();
            const p  = row.querySelector('.placar').value.trim();
            const t2 = row.querySelector('.t2').value.trim();
            if (!t1 || !p || !t2) { ok = false; return; }
            jogos.push({ t1, p, t2 });
        });

        if (!ok) { showToast('Preencha todos os campos dos jogos', true); return; }

        const btn = document.getElementById('btn-salvar');
        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
            await addDoc(collection(db, 'rodadas'), {
                data,
                jogos,
                criadoEm: new Date().toISOString()
            });
            showToast('Rodada salva com sucesso! ✓');
            document.getElementById('data-rodada').value = '';
            document.getElementById('lista-jogos').innerHTML = '';
            atualizarContador();
            carregarRodadas();
        } catch (e) {
            showToast('Erro ao salvar: ' + e.message, true);
        } finally {
            btn.disabled = false;
            btn.textContent = '💾 Salvar Rodada';
        }
    }

    // ---- CARREGAR ----
    async function carregarRodadas() {
        const container = document.getElementById('rodadas-lista');
        container.innerHTML = '<p class="loading-text">Carregando...</p>';

        try {
            const q = query(collection(db, 'rodadas'), orderBy('data', 'desc'));
            const snap = await getDocs(q);

            if (snap.empty) {
                container.innerHTML = '<p class="loading-text">Nenhuma rodada cadastrada ainda.</p>';
                return;
            }

            container.innerHTML = '';
            snap.forEach(docSnap => {
                const d = docSnap.data();
                const div = document.createElement('div');
                div.className = 'rodada-item';
                div.innerHTML = `
                    <div>
                        <span>${d.data}</span><br>
                        <small>${d.jogos.length} jogos</small>
                    </div>
                    <button class="btn-del" onclick="deletarRodada('${docSnap.id}')">Excluir</button>
                `;
                container.appendChild(div);
            });
        } catch(e) {
            container.innerHTML = '<p class="loading-text">Erro ao carregar.</p>';
        }
    }

    // ---- DELETAR ----
    window.deletarRodada = async function(id) {
        if (!confirm('Tem certeza que quer excluir esta rodada?')) return;
        await deleteDoc(doc(db, 'rodadas', id));
        showToast('Rodada excluída');
        carregarRodadas();
    }

    // ---- TOAST ----
    function showToast(msg, erro = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast' + (erro ? ' erro' : '');
        setTimeout(() => t.classList.add('show'), 10);
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Adicionar primeiro jogo e carregar rodadas
    window.adicionarJogo();
    carregarRodadas();
</script>

</body>
</html>
