    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyiMxWmU6ez1i_wdXNJ3egDziaR-A",
            authDomain: "peladeiros-ftv.firebaseapp.com",
            projectId: "peladeiros-ftv",
            storageBucket: "peladeiros-ftv.firebasestorage.app",
            messagingSenderId: "145877201809",
            appId: "1:145877201809:web:ba9aca8aca228cf3637878"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const MESES_PT = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

        function getMesKey(dataStr) {
            const partes = dataStr.split('/');
            return partes[2] + '-' + partes[1];
        }

        function getMesLabel(dataStr) {
            const mes = parseInt(dataStr.split('/')[1], 10);
            return MESES_PT[mes - 1];
        }

        let mesSelecionado = null;
        let dataSelecionada = null;
        let bancoDeDadosJogos = [];

        window.filtrarPorMes = function(mesKey, elementoBotao) {
            document.querySelectorAll('.btn-mes').forEach(btn => btn.classList.remove('ativo'));
            elementoBotao.classList.add('ativo');
            mesSelecionado = mesKey;
            dataSelecionada = null;
            renderizarBotoesDias();
            aplicarFiltros();
        }

        window.filtrarPorDia = function(data, elementoBotao) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo'));
            elementoBotao.classList.add('ativo');
            dataSelecionada = data;
            aplicarFiltros();
        }

        function aplicarFiltros() {
            document.querySelectorAll('.rodada-bloco').forEach(bloco => {
                const dataBloco = bloco.getAttribute('data-data');
                const passaMes = !mesSelecionado || getMesKey(dataBloco) === mesSelecionado;
                const passaDia = !dataSelecionada || dataBloco === dataSelecionada;
                bloco.style.display = (passaMes && passaDia) ? 'block' : 'none';
            });
        }

        function renderizarBotoesDias() {
            const containerDias = document.getElementById('filtros-dias');
            if (!containerDias) return;
            const rodadasFiltradas = mesSelecionado
                ? bancoDeDadosJogos.filter(r => getMesKey(r.data) === mesSelecionado)
                : bancoDeDadosJogos;

            let html = `<button class="btn-filtro ativo" onclick="filtrarPorDia(null, this)">Todas</button>`;
            rodadasFiltradas.forEach(rodada => {
                html += `<button class="btn-filtro" onclick="filtrarPorDia('${rodada.data}', this)">${rodada.data}</button>`;
            });
            containerDias.innerHTML = html;
        }

        function renderizarPaginaJogos() {
            const containerJogos = document.getElementById('lista-rodadas');
            const containerFiltros = document.getElementById('filtros-jogos');

            containerJogos.innerHTML = bancoDeDadosJogos.map(rodada => `
                <div class="rodada-bloco" data-data="${rodada.data}" style="margin-bottom: 50px;">
                    <h2 class="data-titulo">${rodada.data}</h2>
                    <div class="grid-placares">
                        ${rodada.jogos.map(jogo => `
                            <div class="card-jogo">
                                <div class="time time-dir">${jogo.t1}</div>
                                <div class="placar-box">${jogo.p}</div>
                                <div class="time time-esq">${jogo.t2}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            const mesesVistos = new Set();
            const mesesOrdenados = [];
            [...bancoDeDadosJogos].reverse().forEach(rodada => {
                const key = getMesKey(rodada.data);
                if (!mesesVistos.has(key)) {
                    mesesVistos.add(key);
                    mesesOrdenados.push({ key, label: getMesLabel(rodada.data) });
                }
            });

            mesSelecionado = getMesKey(bancoDeDadosJogos[0].data);

            let htmlMeses = '';
            mesesOrdenados.forEach(({ key, label }) => {
                const ativo = key === mesSelecionado ? ' ativo' : '';
                htmlMeses += `<button class="btn-mes${ativo}" onclick="filtrarPorMes('${key}', this)">${label}</button>`;
            });

            containerFiltros.innerHTML = `
                <div class="filtros-meses">${htmlMeses}</div>
                <div id="filtros-dias" class="filtros-dias"></div>
            `;

            renderizarBotoesDias();
            aplicarFiltros();
        }

        // Carregar dados do Firebase
        async function carregarJogos() {
            try {
                const q = query(collection(db, 'rodadas'), orderBy('data', 'desc'));
                const snap = await getDocs(q);

                // Combinar Firebase + dados locais (dados_jogos.js)
                const dadosFirebase = [];
                snap.forEach(doc => {
                    dadosFirebase.push(doc.data());
                });

                // Mesclar com dados históricos do arquivo JS (se existir)
                const dadosLocais = (typeof bancoDeDadosJogosLocal !== 'undefined') ? bancoDeDadosJogosLocal : [];

                // Unir e ordenar por data (mais recente primeiro)
                const todos = [...dadosFirebase, ...dadosLocais];
                todos.sort((a, b) => {
                    const [da, ma, aa] = a.data.split('/').map(Number);
                    const [db2, mb, ab] = b.data.split('/').map(Number);
                    return new Date(ab, mb-1, db2) - new Date(aa, ma-1, da);
                });

                // Remover duplicatas por data
                const vistas = new Set();
                bancoDeDadosJogos = todos.filter(r => {
                    if (vistas.has(r.data)) return false;
                    vistas.add(r.data);
                    return true;
                });

                document.getElementById('loading').style.display = 'none';

                if (bancoDeDadosJogos.length === 0) {
                    document.getElementById('lista-rodadas').innerHTML = '<p style="text-align:center;color:#aaa;padding:40px;">Nenhum jogo cadastrado ainda.</p>';
                    return;
                }

                renderizarPaginaJogos();
            } catch(e) {
                document.getElementById('loading').textContent = 'Erro ao carregar jogos.';
                console.error(e);
            }
        }

        carregarJogos();
    </script>

    <!-- Dados históricos locais (mantidos como fallback) -->
    <script src="dados_jogos.js" onload="window.bancoDeDadosJogosLocal = bancoDeDadosJogos"></script>

</body>
